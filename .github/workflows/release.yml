name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build JAR & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build fat JAR
        run: ./gradlew jar --no-daemon

      - name: Rename JAR with version tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp agwcontrol.jar "agwcontrol-${TAG}.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "agwcontrol ${{ github.ref_name }}"
          generate_release_notes: true
          files: agwcontrol-${{ github.ref_name }}.jar
